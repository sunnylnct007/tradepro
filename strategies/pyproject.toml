[project]
name = "tradepro-strategies"
version = "0.1.0"
description = "TradePro research: data loaders, indicators, backtests, and signal engines for local M-series runs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TradePro" }]

dependencies = [
    "boto3>=1.34",          # S3 bar-store read-through + Secrets Manager
    "numpy>=1.26",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "matplotlib>=3.8",
    "python-dateutil>=2.9",
    "pyarrow>=17.0",          # parquet cache
    "duckdb>=1.1",            # ad-hoc queries over the cache
    "firebase-admin>=6.5",    # push results to Firestore from the Mac
    "mcp>=1.27.0",
    "anthropic>=0.97.0",
    "pdfplumber>=0.11.9",
    "trafilatura>=2.0.0",
    "pymupdf>=1.27.2.3",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.27",
    # PDF attachment for the daily email digest. Lightweight (single
    # wheel, no system deps) and produces structured layouts with
    # text + tables + embedded chart PNGs in one pass. Loaded lazily
    # in email_pdf.py so it doesn't slow up other imports.
    "reportlab>=4.2",
    # Interactive chart builder for the viz framework
    # (tradepro_strategies.viz). Soft-imported only inside chart builders
    # so non-viz code paths don't pay the import cost.
    "plotly>=6.0",
    "exchange-calendars>=4.13.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "torch>=2.3",             # MPS accelerated on Apple Silicon
]
# boto3 was an OPTIONAL extra until 22 Aug 2026 — which meant the bar
# store's S3 read-through could never run (ModuleNotFoundError, swallowed
# by its fail-safe) and the Secrets Manager path silently no-op'd. S3 is
# now the SOURCE OF TRUTH for market data (owner ruling), so it is core.
# The `aws` extra is kept as an alias so existing `uv sync --extra aws`
# invocations keep working.
aws = [
    "boto3>=1.34",
]
# IBKR bar-cache provider — connects to TWS/IB Gateway via ib_insync.
# Required only on machines running Trader Workstation (your Mac).
# The provider lazy-imports this; without it the chain gracefully falls
# through to IG / yfinance. Install with: uv sync --extra ibkr
ibkr = [
    "ib_insync>=0.9.86",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

