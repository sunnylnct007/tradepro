AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: TradePro Screener — daily wheel + swing screener Lambda (SRS v1.1)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 300           # 5 minutes
    MemorySize: 256
    Environment:
      Variables:
        TRADEPRO_SECRET_NAME: !Ref SecretName
        IBKR_WATCHLIST_ID: "101"
    Layers:
      - !Ref DepsLayer

Parameters:
  SecretName:
    Type: String
    Default: tradepro/screener
    Description: AWS Secrets Manager secret name holding IBKR + Claude API credentials

Resources:
  # ------------------------------------------------------------------
  # Lambda dependencies layer
  # ------------------------------------------------------------------
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: tradepro-screener-deps
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

  # ------------------------------------------------------------------
  # Screener Lambda
  # ------------------------------------------------------------------
  ScreenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tradepro-screener
      CodeUri: .
      Handler: lambda_function.handler
      Description: Daily TradePro wheel + swing screener
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*"
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
        - CloudWatchLogsFullAccess

  # ------------------------------------------------------------------
  # EventBridge schedule: Mon–Fri 07:00 Europe/London
  # Note: EventBridge cron is UTC — London is UTC+1 in BST (summer),
  # UTC+0 in GMT (winter). 07:00 London = 06:00 UTC (BST) / 07:00 UTC (GMT).
  # Using 06:00 UTC covers BST; shift to 07:00 UTC Oct–Mar manually or
  # use a timezone-aware scheduler rule (requires EventBridge Scheduler).
  # ------------------------------------------------------------------
  ScreenerScheduleBST:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: tradepro-screener-daily
      Description: Trigger TradePro screener Mon-Fri at 07:00 Europe/London
      ScheduleExpression: "cron(0 6 ? * MON-FRI *)"
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ScreenerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScreenerFunction.Arn

Outputs:
  FunctionArn:
    Value: !GetAtt ScreenerFunction.Arn
  FunctionName:
    Value: !Ref ScreenerFunction
