# ============================================================
# Redeploy the TradePro API by SSM-ing into the host, pulling the
# latest commit on the chosen branch, ECR-pulling the image, and
# `docker compose up -d`.
#
# Run from the Actions tab → "aws-redeploy" → "Run workflow".
# Inputs:
#   - branch (default: main)
#   - image_tag (default: latest) — use a SHA8 to pin a specific build
#
# No SSH keys — SSM authenticates via the instance role. The instance
# must be running; if it isn't, run aws-start first.
# ============================================================

name: aws-redeploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR image tag to deploy. Defaults to "latest". Use a SHA (8 chars) to pin a specific build.'
        required: false
        default: 'latest'
  # Auto-roll after the image is built+pushed on main, so a merge ships
  # end-to-end. The redeploy job self-heals a stopped instance (starts it
  # + waits for SSM Online), which is the prior nightly-stop failure mode.
  workflow_run:
    workflows: ["aws-build-push"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::108703420282:role/ccit-dev-energycosmos-deploy
  INSTANCE_NAME_PREFIX: ccit-dev-tradepro-host
  DEPLOY_DIR: /opt/tradepro
  # The live, public health endpoint. This is the ONLY thing that proves a
  # deploy worked: it exercises DNS → Caddy → nginx → api → Postgres exactly
  # as a user does. `docker compose up -d` succeeding proves only that
  # containers were created.
  HEALTH_URL: https://tradepro.showsoldprice.com/health

jobs:
  redeploy:
    runs-on: ubuntu-latest
    # When triggered by aws-build-push, only proceed if that build
    # succeeded. Manual dispatch always proceeds.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Encode compose file + Caddyfile for SSM payload
        id: compose
        run: |
          # Ship the compose file AND Caddyfile via the runner's
          # checkout — removes the dependency on the SSM-stored GitHub
          # PAT (which has gone stale before — see the aws-bootstrap
          # commit log) and keeps redeploy a pure image-roll operation.
          ENC=$(base64 -w0 docker-compose.aws.yaml)
          echo "b64=$ENC" >> "$GITHUB_OUTPUT"
          CADDY_ENC=$(base64 -w0 Caddyfile)
          echo "caddy_b64=$CADDY_ENC" >> "$GITHUB_OUTPUT"

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find instance, start if stopped, wait for SSM Online
        id: find
        run: |
          # Include stopped/stopping so a redeploy during the nightly
          # auto-stop window self-heals instead of erroring out.
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME_PREFIX}*" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | tr -s '\t\n' ' ' | awk '{print $1}')
          if [ -z "$ID" ]; then
            echo "::error::No instance found with name prefix ${INSTANCE_NAME_PREFIX}"
            exit 1
          fi
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"

          STATE=$(aws ec2 describe-instances --instance-ids "$ID" \
                  --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instance $ID is '$STATE'"
          if [ "$STATE" != "running" ]; then
            echo "Starting instance (was '$STATE') ..."
            aws ec2 start-instances --instance-ids "$ID"
            aws ec2 wait instance-running --instance-ids "$ID"
          fi

          # The SSM agent needs ~30-60s after boot to register Online.
          # Sending a command before then is what returned an empty
          # CommandId. Wait until it's Online (or fail loudly).
          echo "Waiting for SSM agent to report Online ..."
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
            echo "  attempt $i: PingStatus=${PING:-none}"
            if [ "$PING" = "Online" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::SSM agent did not come Online within 5 min — cannot send redeploy command"
          exit 1

      - name: Send redeploy command via SSM
        id: ssm
        run: |
          # workflow_run triggers carry no inputs, so fall back to latest.
          IMAGE_TAG='${{ github.event.inputs.image_tag || 'latest' }}'

          # Build the SSM RunShellScript payload as JSON to keep shell +
          # YAML quoting sane. The compose file is shipped fresh from
          # the runner's checkout (base64-encoded above) - no GH PAT,
          # no git on the box. NB: every comment in this run-block must
          # be OUTSIDE the single-quoted jq script - an apostrophe inside
          # the quote terminates the bash string and the next token
          # blows up. Also: the "touch .env" before the sed upsert is
          # defensive in case bootstrap never ran.
          jq -n \
            --arg deploy_dir "$DEPLOY_DIR" \
            --arg image_tag "$IMAGE_TAG" \
            --arg compose_b64 "${{ steps.compose.outputs.b64 }}" \
            --arg caddy_b64 "${{ steps.compose.outputs.caddy_b64 }}" \
            '{
              commands: [
                "set -euo pipefail",
                "mkdir -p " + $deploy_dir,
                ("cd " + $deploy_dir),
                ("COMPOSE_B64=" + ($compose_b64 | @sh)),
                "echo \"$COMPOSE_B64\" | base64 -d > docker-compose.aws.yaml",
                ("CADDY_B64=" + ($caddy_b64 | @sh)),
                "echo \"$CADDY_B64\" | base64 -d > Caddyfile",
                "aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin 108703420282.dkr.ecr.eu-west-2.amazonaws.com",
                "touch .env",
                ("if grep -q ^IMAGE_TAG= .env; then sed -i \"s|^IMAGE_TAG=.*|IMAGE_TAG=" + $image_tag + "|\" .env; else echo IMAGE_TAG=" + $image_tag + " >> .env; fi"),
                "echo === docker compose pull ===",
                "docker compose -f docker-compose.aws.yaml pull > /tmp/tradepro-pull.log 2>&1 && tail -12 /tmp/tradepro-pull.log",
                "echo === docker compose up ===",
                "docker compose -f docker-compose.aws.yaml up -d --remove-orphans --force-recreate > /tmp/tradepro-up.log 2>&1 && tail -20 /tmp/tradepro-up.log",
                "echo === docker compose ps ===",
                "docker compose -f docker-compose.aws.yaml ps",
                "docker image prune -f > /dev/null 2>&1 || true"
              ]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.find.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "tradepro redeploy from GH Actions" \
            --parameters file:///tmp/ssm-params.json \
            --output text --query 'Command.CommandId')
          if [ -z "$CMD_ID" ] || [ "$CMD_ID" = "None" ]; then
            echo "::error::SSM send-command returned no CommandId (instance not reachable via SSM)"
            exit 1
          fi
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for command to finish
        run: |
          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --details \
              --query 'CommandInvocations[0].Status' --output text 2>/dev/null || echo Pending)
            echo "  attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::SSM command ended in $STATUS"
              aws ssm list-command-invocations --command-id "${{ steps.ssm.outputs.command_id }}" --details \
                --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text || true
              exit 1
            fi
            sleep 10
          done
          # Previously a warning, which meant a redeploy that hung silently
          # still finished green. A deploy we cannot confirm is a failed deploy.
          echo "::error::SSM command still in progress after 5 min — treating as failed"
          exit 1

      - name: Show command output tail
        if: always()
        run: |
          aws ssm list-command-invocations --command-id "${{ steps.ssm.outputs.command_id }}" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text | tail -50 || true

      # ------------------------------------------------------------------
      # VERIFICATION. Everything above proves only that `docker compose up`
      # was accepted. On 2026-08-23 that was true while the api container
      # crash-looped on a migration that blew its command timeout: this
      # workflow reported success three times across a six-hour outage and
      # the owner found out by trying to browse the site. Two gates now:
      # the container must reach `healthy` on the box, and the public
      # health URL must answer 200. Either one failing fails the deploy.
      # ------------------------------------------------------------------
      - name: Verify api container reaches healthy
        id: onbox
        run: |
          cat > /tmp/verify.sh <<'SCRIPT_EOF'
          cd /opt/tradepro
          CID="$(docker compose -f docker-compose.aws.yaml ps -q api)"
          if [ -z "$CID" ]; then
            echo "FAIL: no api container exists after redeploy"
            docker compose -f docker-compose.aws.yaml ps
            exit 1
          fi
          # Allow ~17 min. MigrationRunner permits a 900s migration, so a
          # legitimately slow start must not be reported as a failure. A crash
          # loop does not wait that out — RestartCount catches it in seconds.
          for i in $(seq 1 100); do
            ST="$(docker inspect --format '{{.State.Status}}' "$CID")"
            RC="$(docker inspect --format '{{.RestartCount}}' "$CID")"
            HS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CID")"
            echo "attempt $i: status=$ST health=$HS restarts=$RC"
            if [ "$HS" = "healthy" ]; then echo "OK: api healthy"; exit 0; fi
            if [ "$ST" = "exited" ] || [ "$RC" -gt 2 ]; then
              echo "FAIL: api is crash-looping (status=$ST restarts=$RC)"
              break
            fi
            sleep 10
          done
          echo "=== FAIL: api never became healthy ==="
          docker compose -f docker-compose.aws.yaml ps
          echo "--- api logs (last 100) — the reason is almost always here ---"
          docker compose -f docker-compose.aws.yaml logs --tail=100 api 2>&1
          exit 1
          SCRIPT_EOF
          jq -n --arg s "$(cat /tmp/verify.sh)" '{commands: [$s]}' > /tmp/verify-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.find.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "tradepro post-deploy health verification" \
            --parameters file:///tmp/verify-params.json \
            --output text --query 'Command.CommandId')
          echo "verify command: $CMD_ID"

          for i in $(seq 1 115); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ steps.find.outputs.instance_id }}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] \
               || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            sleep 10
          done

          echo "--- on-box verification output ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ steps.find.outputs.instance_id }}" \
            --query 'StandardOutputContent' --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::api container did not reach healthy after redeploy (SSM $STATUS) — the site is down"
            exit 1
          fi

      - name: Probe the live health endpoint
        run: |
          # End-to-end, from outside: DNS → Caddy → nginx → api → Postgres.
          # /health is deliberately exempt from basic auth, so a 401 here means
          # the backend is down and nginx is serving a gated error page — not
          # that credentials changed. Do not "fix" that by sending a password.
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /tmp/health.txt -w '%{http_code}' --max-time 15 "$HEALTH_URL" || echo 000)
            BODY=$(head -c 200 /tmp/health.txt 2>/dev/null | tr -d '\n')
            echo "attempt $i: HTTP $CODE $BODY"
            if [ "$CODE" = "200" ] && grep -q '"status"' /tmp/health.txt 2>/dev/null; then
              echo "OK: $HEALTH_URL is live and returning the API's own JSON"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTH_URL never returned a healthy 200 after redeploy — the deploy did NOT land"
          exit 1

      - name: Summary
        run: |
          echo "## TradePro redeployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified: api container healthy on-box AND \`$HEALTH_URL\` returned 200" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${{ github.event.inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: \`${{ steps.find.outputs.instance_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compose file: shipped from this commit via runner checkout" >> "$GITHUB_STEP_SUMMARY"
