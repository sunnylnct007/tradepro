# ============================================================
# Nightly Postgres backup → S3 (owner directive 13 Aug 2026:
# the store data "will be quite key for our company" — and the
# EC2 Postgres had NO backup of any kind until this workflow).
#
# Runs at 21:15 UTC — the box auto-stops overnight and starts
# ~13:30 UTC, so the slot must land while it's awake (evening
# jobs run until ~22:30 UTC). pg_dump executes ON the instance
# via SSM (same channel as the deploy workflows) and uploads
# from there with the INSTANCE role; if that role lacks
# s3:PutObject on the bucket, this fails LOUDLY here — add the
# policy, don't work around it.
#
# Restore (manual): aws s3 cp s3://<bucket>/daily/<file> - \
#   | gunzip | docker exec -i <pg-container> psql -U tradepro tradepro
# ============================================================

name: db-backup

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::108703420282:role/ccit-dev-energycosmos-deploy
  INSTANCE_NAME_PREFIX: ccit-dev-tradepro-host
  BACKUP_BUCKET: tradepro-db-backups-108703420282

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure backup bucket (with 30-day lifecycle)
        run: |
          if ! aws s3api head-bucket --bucket "$BACKUP_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BACKUP_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-public-access-block --bucket "$BACKUP_BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-lifecycle-configuration --bucket "$BACKUP_BUCKET" \
              --lifecycle-configuration '{"Rules":[{"ID":"expire-dailies","Status":"Enabled","Filter":{"Prefix":"daily/"},"Expiration":{"Days":30}}]}'
          fi

      - name: Find running instance
        id: find
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME_PREFIX}*" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | awk '{print $1}')
          if [ -z "$ID" ]; then
            echo "::error::No RUNNING instance (box asleep at backup time?) — backup skipped, THIS IS A MISSED BACKUP"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Dump + upload on the instance (via SSM)
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%M)
          # Presigned PUT from the WORKFLOW role (which owns the bucket) —
          # the instance role has no s3:PutObject (verified live, first run:
          # AccessDenied) and doesn't need it: the box just curls the dump
          # to the URL. URL lifetime 1h, single object.
          pip -q install boto3 2>/dev/null || true
          PRESIGNED=$(python3 -c "import boto3; print(boto3.client('s3', region_name='$AWS_REGION').generate_presigned_url('put_object', Params={'Bucket': '$BACKUP_BUCKET', 'Key': 'daily/tradepro-$STAMP.sql.gz'}, ExpiresIn=3600))")
          jq -n --arg url "$PRESIGNED" --arg stamp "$STAMP" '{commands: [
            "set -euo pipefail",
            "C=$(docker ps --filter name=postgres --format {{.Names}} | head -1)",
            "test -n \"$C\" || { echo NO_PG_CONTAINER; exit 1; }",
            ("docker exec \"$C\" pg_dump -U tradepro tradepro | gzip > /tmp/tradepro-" + $stamp + ".sql.gz"),
            ("SZ=$(stat -c%s /tmp/tradepro-" + $stamp + ".sql.gz)"),
            "echo DUMP_BYTES=$SZ",
            "test \"$SZ\" -gt 100000 || { echo DUMP_SUSPICIOUSLY_SMALL; exit 1; }",
            ("curl -fsS -X PUT -T /tmp/tradepro-" + $stamp + ".sql.gz \"" + $url + "\""),
            ("rm -f /tmp/tradepro-" + $stamp + ".sql.gz"),
            "echo BACKUP_OK"
          ]}' > /tmp/ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.find.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "nightly pg_dump -> s3 (presigned)" \
            --parameters file:///tmp/ssm-params.json \
            --output text --query 'Command.CommandId')
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ steps.find.outputs.id }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            [ "$STATUS" = "Success" ] && break
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" \
                --instance-id "${{ steps.find.outputs.id }}" \
                --query StandardErrorContent --output text
              echo "::error::pg_dump/upload failed on instance ($STATUS)"
              exit 1
            fi
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ steps.find.outputs.id }}" \
            --query StandardOutputContent --output text | tail -5

      - name: Verify object landed
        run: |
          aws s3 ls "s3://$BACKUP_BUCKET/daily/" | tail -3
          N=$(aws s3 ls "s3://$BACKUP_BUCKET/daily/" | grep -c "$(date -u +%Y-%m-%d)")
          test "$N" -ge 1 || { echo "::error::no backup object for today in S3"; exit 1; }
