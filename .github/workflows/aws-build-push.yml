# ============================================================
# Build the TradePro API image in CI and push to ECR.
#
# Pre-built images cut deploy time from 5+ min on the t4g.small (.NET
# restore + publish are RAM-heavy) to ~30 sec (just `docker pull`).
#
# RUNS:
#   - on push to main, when backend/ or this workflow changes
#   - manually via Run workflow
#
# IMAGES + TAGS:
#   <ecr>/ccit-dev-tradepro-api:<sha>      → pinned, immutable in spirit
#   <ecr>/ccit-dev-tradepro-api:latest     → mutable rolling tag
#
# After this workflow, run `aws-redeploy` with `image_tag=<sha>` (or
# leave it as `latest`) to pull + restart the stack on EC2.
# ============================================================

name: aws-build-push

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      # The read-only remote MCP server ships from here.
      - 'strategies/tradepro_strategies/mcp/**'
      - 'strategies/tradepro_strategies/cli/mcp_http.py'
      - 'strategies/Dockerfile.mcp'
      - 'strategies/pyproject.toml'
      - 'strategies/uv.lock'
      - '.github/workflows/aws-build-push.yml'
      # THE REDEPLOY SHIPS THESE, SO A CHANGE TO THEM MUST TRIGGER IT.
      # Both files are copied to the instance by aws-redeploy, which only
      # auto-runs after this workflow — so with them missing from this list a
      # Caddyfile or compose edit merged to main and then simply sat there.
      # Found 19 Sep: the MCP OAuth-discovery fix merged green and was never
      # served, because nothing in the pipeline had any reason to run.
      - 'Caddyfile'
      - 'docker-compose.aws.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::108703420282:role/ccit-dev-energycosmos-deploy
  ECR_REGISTRY: 108703420282.dkr.ecr.eu-west-2.amazonaws.com
  API_REPO:      ccit-dev-tradepro-api
  FRONTEND_REPO: ccit-dev-tradepro-frontend
  MCP_REPO:      ccit-dev-tradepro-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    environment: aws-prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          SHA=${GITHUB_SHA::8}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "api_sha=${ECR_REGISTRY}/${API_REPO}:${SHA}"            >> "$GITHUB_OUTPUT"
          echo "api_latest=${ECR_REGISTRY}/${API_REPO}:latest"         >> "$GITHUB_OUTPUT"
          echo "frontend_sha=${ECR_REGISTRY}/${FRONTEND_REPO}:${SHA}"   >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${ECR_REGISTRY}/${FRONTEND_REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "mcp_sha=${ECR_REGISTRY}/${MCP_REPO}:${SHA}"                >> "$GITHUB_OUTPUT"
          echo "mcp_latest=${ECR_REGISTRY}/${MCP_REPO}:latest"             >> "$GITHUB_OUTPUT"

      - name: Build + push API image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.api_sha }}
            ${{ steps.tags.outputs.api_latest }}
          # Bake commit + build time into the image so /health/details
          # can answer "is this the SHA I just pushed?" without SSM.
          build-args: |
            BACKEND_COMMIT=${{ github.sha }}
            BACKEND_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          # Layer cache lives in the ECR repo as the `:cache` tag —
          # keeps subsequent builds fast without an extra registry.
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.API_REPO }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.API_REPO }}:cache,mode=max

      - name: Build + push frontend image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend_sha }}
            ${{ steps.tags.outputs.frontend_latest }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:cache,mode=max

      # The remote MCP server. Guard the build with the read-only
      # surface tests: the image must not be publishable if a
      # mutating tool can reach the public endpoint.
      - name: Verify the MCP read-only surface
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd strategies
          uv run pytest tests/test_mcp_read_only_surface.py -q

      - name: Build + push MCP image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./strategies
          file: ./strategies/Dockerfile.mcp
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.mcp_sha }}
            ${{ steps.tags.outputs.mcp_latest }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.MCP_REPO }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.MCP_REPO }}:cache,mode=max

      - name: Summary
        run: |
          echo "## Built + pushed image tags" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.api_sha }}\`"      >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.frontend_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.mcp_sha }}\`"      >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger \`aws-redeploy\` with \`image_tag=${{ steps.tags.outputs.sha }}\` to roll out (or leave as \`latest\`)." >> "$GITHUB_STEP_SUMMARY"
